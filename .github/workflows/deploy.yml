name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure API endpoint
        env:
          NEXUS_API_URL: ${{ vars.NEXUS_API_URL }}
        run: |
          node -e "const fs = require('node:fs'); const url = process.env.NEXUS_API_URL || 'https://example.invalid/api'; fs.mkdirSync('src/environments', { recursive: true }); fs.writeFileSync('src/environments/enviroment.ts', 'export const environment = { production: true, apiUrl: ' + JSON.stringify(url.replace(/\\/$/, '')) + ' };\\n');"
      - name: Build Angular for project site
        run: npx ng build --configuration production --base-href /nexus-web-app/
      - name: Prepare Pages artifact
        run: |
          test -f dist/nexusapp/browser/index.html
          cp dist/nexusapp/browser/index.html dist/nexusapp/browser/404.html
          touch dist/nexusapp/browser/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nexusapp/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
