<header class="nexus-header">
  <div class="top-bar">
    <div class="container top-content">
      <a routerLink="/" aria-label="Nexus, volver al inicio" class="brand-link"><span class="nexus-wordmark">nexus</span><small>MARKETPLACE</small></a>
      <form class="search-wrapper" (ngSubmit)="search()" role="search">
        <label class="search-box">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m16 16 5 5"/></svg>
          <span class="sr-only">Buscar artículos y ofertas</span>
          <input name="search" [(ngModel)]="searchText" type="search" placeholder="Busca tecnología, hogar, moda..." class="search-input" />
        </label>
        <button type="submit" class="search-submit">Buscar</button>
      </form>
      <div class="actions-wrapper">
        <a routerLink="/" [queryParams]="{tipo:'favorites'}" class="icon-btn favorites-link" aria-label="Ver mis favoritos">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </a>
        <a routerLink="/proyecto" class="btn-publish-premium">Cómo funciona <span aria-hidden="true">↗</span></a>
        <button class="mobile-menu" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Abrir navegación">☰</button>
      </div>
    </div>
  </div>
  <div class="bottom-bar" [class.menu-open]="menuOpen">
    <nav class="container bottom-content main-nav" aria-label="Navegación principal">
      <button *ngFor="let link of navLinks" type="button" class="nav-item" (click)="navigateToFilter(link.query)">
        {{ link.label }}
      </button>
      <a routerLink="/proyecto" class="nav-item" (click)="menuOpen = false">El proyecto</a>
    </nav>
  </div>
</header>
