<article class="product-card">
  <div class="card-image-wrapper">
    <a [routerLink]="getDetailUrl(product)" class="card-image-link" [attr.aria-label]="'Ver detalles de ' + product.titulo">
      <img [src]="getImageUrl(product)" [alt]="product.titulo" loading="lazy" class="card-image" />
    </a>
    <span class="badge badge-type" [class.deal]="isOferta(product)" [class.second-hand]="!isOferta(product)">
      {{ isOferta(product) ? 'OFERTA' : 'SEGUNDA MANO' }}
    </span>
    <span class="badge badge-discount" *ngIf="getDiscount(product) > 0">−{{ getDiscount(product) }}%</span>
    <button type="button" class="favorite-toggle" [class.selected]="favorites.has(product)"
      (click)="toggleFavorite()" [attr.aria-label]="favorites.has(product) ? 'Quitar de favoritos' : 'Añadir a favoritos'"
      [attr.aria-pressed]="favorites.has(product)">♥</button>
  </div>
  <div class="card-content">
    <div class="card-meta"><span>{{ product.categoria || 'General' }}</span><span>{{ getSellerName(product) }}</span></div>
    <a [routerLink]="getDetailUrl(product)" class="card-title">{{ product.titulo }}</a>
    <div class="price-section">
      <span class="current-price">{{ getPrice(product) }}</span>
      <span class="old-price" *ngIf="getOriginalPrice(product) as oldPrice">{{ oldPrice }}</span>
    </div>
    <a class="btn-action" [routerLink]="getDetailUrl(product)">Ver detalles <span aria-hidden="true">↗</span></a>
  </div>
</article>
